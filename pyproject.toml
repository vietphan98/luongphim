[project]
name = "luongphim"
version = "0.1.0"
description = "Chạy nhiều job tạo video AI song song, có dashboard local"
authors = [{name = "Việt Phan"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
test = ["pytest>=7"]

[project.scripts]
luongphim = "luongphim.cli:main"

[tool.setuptools]
packages = ["luongphim", "luongphim.providers"]
[tool.setuptools.package-data]
luongphim = ["dashboard.html"]
